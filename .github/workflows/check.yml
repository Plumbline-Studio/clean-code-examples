name: check

# Runs every example's tests on every change, and on pull requests applies the rule from
# 01-every-fix-becomes-a-check: a change that says it is a fix must add or change a test.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every example's tests
        run: |
          for d in [0-9][0-9]-*/; do
            echo "== $d"
            (cd "$d" && python3 -m unittest -v) || exit 1
          done

  every-fix-becomes-a-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A fix needs a test
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 01-every-fix-becomes-a-check/fix_needs_check.py "$TITLE" $(git diff --name-only "$BASE" "$HEAD")
